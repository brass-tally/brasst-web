<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brasstally · books for people who run a company and a life</title>
    <meta name="description" content="Capture receipts in a chat, anchor to your real bank balance, keep separate business and personal ledgers, and turn the year into a CRA-ready T2 draft." />
    <meta name="theme-color" content="#101613" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brasstally" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 16px; line-height: 1.6;
        font-weight: 400;
        letter-spacing: -0.003em;
        font-feature-settings: 'cv11','ss01';
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      h1,h2,h3 { letter-spacing: -0.02em; }
      /* numbers: Geist Mono, medium weight, tabular so columns never jitter and read crisp */
      .tabular-nums { font-variant-numeric: tabular-nums lining-nums; font-weight: 500; letter-spacing: 0; }
      /* the app leans on these utility sizes heavily; nudge the smallest ones up for legibility */
      .text-xs { font-size: 12.5px; line-height: 1.45; }
      .text-sm { font-size: 14.5px; line-height: 1.55; }
      /* uppercase mono labels: add tracking so they don't smear together */
      button { -webkit-tap-highlight-color: transparent; }
      @keyframes tabEnter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .tab-enter { animation: tabEnter .34s cubic-bezier(.2,.8,.2,1); }
      @keyframes fadeKey { from { opacity: 0; } to { opacity: 1; } }
      .fade-in-key { animation: fadeKey .34s ease; }
      @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
      .toast-in { animation: toastIn .3s cubic-bezier(.2,.8,.2,1); }
      .capture-pop { opacity: 0; transform: translateY(12px) scale(.98); pointer-events: none; transition: opacity .28s ease, transform .28s cubic-bezier(.2,.8,.2,1); }
      .capture-pop.open { opacity: 1; transform: none; pointer-events: auto; }
      .dock-btn:active { transform: scale(.9) !important; }
      .dock-capture:active { transform: scale(.92); }
      .dock-capture { transition: transform .18s cubic-bezier(.2,.8,.2,1); }
      /* gentle entrance for cards/sections */
      @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .rise-in { animation: riseIn .4s cubic-bezier(.2,.8,.2,1) both; }
      @media (prefers-reduced-motion: reduce) {
        .tab-enter, .fade-in-key, .toast-in, .rise-in { animation: none; }
        .capture-pop { transition: none; }
      }

      /* dock: comfortable, safe-area aware, responsive hit targets */
      .dock { margin-bottom: env(safe-area-inset-bottom, 0px); }
      .dock-btn { width: 42px; height: 42px; }
      .dock-capture { width: 44px; height: 44px; }
      @media (max-width: 480px) {
        .dock-btn { width: 40px; height: 40px; }
        .dock { gap: 0 !important; padding-left: 6px; padding-right: 6px; }
      }
      @media (max-width: 360px) {
        .dock-btn { width: 36px; height: 36px; }
      }
      /* prevent iOS zoom on input focus: inputs stay >=16px */
      input, select, textarea { font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
