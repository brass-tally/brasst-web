    <script>
      /* Paint the saved theme before first paint, so a light-mode reload never
         flashes the dark ledger. Shares the landing page's storage key, so
         crossing from brasstally.com into /app keeps the same theme. */
      (function () {
        // Light is the ground state for everyone. Night is a choice, and once
        // made it is remembered here. brasstally.com writes the same key before
        // its own first paint, so crossing into /app never flips the lights.
        var saved = null;
        try { saved = localStorage.getItem("bt-theme"); } catch (e) {}
        document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/app/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
