<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brasstally · books for people who run a company and a life</title>
    <meta name="description" content="Capture receipts in a chat, anchor to your real bank balance, keep separate business and personal ledgers, and turn the year into a CRA-ready T2 draft." />
    <meta name="theme-color" content="#101613" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brasstally" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/app/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/app/icon-192.png" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
      body {
        font-family: 'Geist', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 15px; line-height: 1.55;
        font-weight: 400;
        letter-spacing: -0.006em;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      /* headings: same grotesque, tightened — one family, weight does the work */
      h1, h2, h3 { font-family: inherit; font-weight: 600; letter-spacing: -0.021em; line-height: 1.2; }
      /* numbers: Geist Mono, tabular so columns never jitter */
      .tabular-nums { font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.01em; }
      /* The type scale itself lives in tailwind.config.js — don't re-patch it
         here, or the two definitions drift and whichever stylesheet loads last
         wins. */
      button { -webkit-tap-highlight-color: transparent; }
      @keyframes tabEnter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .tab-enter { animation: tabEnter .34s cubic-bezier(.2,.8,.2,1); }
      @keyframes fadeKey { from { opacity: 0; } to { opacity: 1; } }
      .fade-in-key { animation: fadeKey .34s ease; }
      @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
      .toast-in { animation: toastIn .3s cubic-bezier(.2,.8,.2,1); }
      .capture-pop { opacity: 0; transform: translateY(12px) scale(.98); pointer-events: none; transition: opacity .28s ease, transform .28s cubic-bezier(.2,.8,.2,1); }
      .capture-pop.open { opacity: 1; transform: none; pointer-events: auto; }
      .dock-btn:active { transform: scale(.9) !important; }
      .dock-capture:active { transform: scale(.92); }
      .dock-capture { transition: transform .18s cubic-bezier(.2,.8,.2,1); }
      /* gentle entrance for cards/sections */
      @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .rise-in { animation: riseIn .4s cubic-bezier(.2,.8,.2,1) both; }
      @media (prefers-reduced-motion: reduce) {
        .tab-enter, .fade-in-key, .toast-in, .rise-in { animation: none; }
        .capture-pop { transition: none; }
      }

      /* dock: comfortable, safe-area aware, responsive hit targets.
         Eight sections plus Tally have to fit on one row without wrapping or
         scrolling (a scroll container would clip the tooltips above it), so the
         sections give up width as the screen narrows and Tally never does. */
      .dock { margin-bottom: env(safe-area-inset-bottom, 0px); }
      .dock-btn { width: 42px; height: 42px; }
      .dock-capture { width: 44px; height: 44px; }
      @media (max-width: 480px) {
        .dock-btn { width: 38px; height: 38px; }
        .dock { gap: 0 !important; padding-left: 6px; padding-right: 6px; }
      }
      @media (max-width: 400px) {
        .dock-btn { width: 34px; height: 34px; }
      }
      @media (max-width: 360px) {
        .dock-btn { width: 32px; height: 32px; }
      }
      /* Safari zooms the whole page when you focus a field under 16px. The
         Tailwind size classes on those fields are more specific than a bare
         element selector, so this has to shout — and only on phone widths,
         where the zoom happens and the designed scale matters least. */
      @media (max-width: 820px) {
        input, select, textarea { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/app/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
