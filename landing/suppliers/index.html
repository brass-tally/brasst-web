<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="https://www.brasstally.com/app/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<title>Suppliers · Brasstally</title>
<style>
  /* The site's own tokens, read from brasstally.com rather than guessed.
     I built this against the app's ember palette first, which is a different
     set: the marketing site and the supplier page are what an outsider sees
     together, so they have to match each other. */
  :root{
    --bg:#FAF9F7; --surface:#FFFFFF; --sunk:#F5F3F0; --line:#EDEAE5; --line2:#E2DDD6;
    --text:#1C1917; --muted:#5A534E; --faint:#8A827B;
    --accent:#F59E0B; --accentText:#A9620A; --onAccent:#241703;
    --tint:rgba(245,158,11,.12); --credit:#08805A; --debit:#C4442F;
    --sh:0 1px 2px rgba(28,25,23,.05),0 10px 26px -14px rgba(28,25,23,.14);
    --sans:'Inter',ui-sans-serif,system-ui,sans-serif;
    --mono:'Geist Mono',ui-monospace,monospace;
  }
  html[data-t="dark"], :root:has(#darkpref:checked){
    --bg:#100E0C; --surface:#1A1714; --sunk:#141210; --line:#2A2521; --line2:#37312B;
    --text:#F5F1EC; --muted:#B0A79F; --faint:#877E76;
    --accent:#FBBF24; --accentText:#FBBF24; --onAccent:#1C1200;
    --tint:rgba(251,191,36,.13); --credit:#34D399; --debit:#FB7185;
    --sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#100E0C; --surface:#1A1714; --sunk:#141210; --line:#2A2521; --line2:#37312B;
      --text:#F5F1EC; --muted:#B0A79F; --faint:#877E76;
      --accent:#FBBF24; --accentText:#FBBF24; --onAccent:#1C1200;
      --tint:rgba(251,191,36,.13); --credit:#34D399; --debit:#FB7185;
      --sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:16px;line-height:1.55;padding:22px 16px 72px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto}

  .mast{display:flex;align-items:center;gap:10px;margin:0 auto 18px;max-width:620px}
  .mast img{width:26px;height:26px;border-radius:7px}
  .mark{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .mark span{color:var(--accentText)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:22px;margin-bottom:14px;box-shadow:var(--sh)}
  h1{font-size:23px;line-height:1.25;margin:0 0 6px;font-weight:600;letter-spacing:-.015em}
  .sub{color:var(--muted);font-size:15px;margin:0 0 18px}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--accentText);margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:11px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:none}
  .m{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
  .small{font-size:13px;color:var(--faint)}
  b{font-weight:600}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;margin-top:4px}
  .paid{background:color-mix(in srgb,var(--credit) 15%,transparent);color:var(--credit)}
  .part{background:var(--tint);color:var(--accentText)}
  .wait{background:var(--sunk);color:var(--muted)}
  .stop{background:color-mix(in srgb,var(--debit) 14%,transparent);color:var(--debit)}
  .gone{background:var(--sunk);color:var(--faint);text-decoration:line-through}
  .none{color:var(--muted);font-size:15px;padding:8px 0}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font:inherit;font-size:14.5px;cursor:pointer}
  .tab.on{background:var(--accent);color:var(--onAccent);border-color:transparent;font-weight:600}

  input,select,textarea{width:100%;min-height:46px;padding:0 13px;margin:6px 0 2px;
    background:var(--sunk);border:1px solid var(--line);border-radius:12px;color:var(--text);
    font:inherit;font-size:16px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
  button.go{background:var(--accent);color:var(--onAccent);border:none;padding:13px 22px;
    border-radius:999px;font:inherit;font-weight:600;font-size:15.5px;cursor:pointer;margin-top:14px}
  button.ghost{background:transparent;color:var(--accentText);border:none;font:inherit;
    font-size:14.5px;cursor:pointer;padding:10px 4px;text-decoration:underline}
  .err{color:var(--debit);font-size:14.5px;margin-top:10px}
  .ok{color:var(--credit);font-size:14.5px;margin-top:10px}
  .drop{border:1.5px dashed var(--line2);border-radius:12px;padding:18px 14px;text-align:center;
    color:var(--muted);font-size:15px;cursor:pointer;margin-top:6px;
    transition:border-color .15s,background .15s}
  .drop.over{border-color:var(--accent);background:var(--tint)}
  .drop b{color:var(--text)}

  .helpbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font:inherit;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;flex:none;margin-left:auto}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;
    justify-content:center;padding:16px;z-index:50}
  .sheet .card{max-width:560px;width:100%;margin:0;max-height:86vh;overflow:auto}
  @media (min-width:640px){ .sheet{align-items:center} }

  .total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding-top:12px;margin-top:6px;border-top:1px solid var(--line);font-size:16px}
  footer{color:var(--faint);font-size:12.5px;text-align:center;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div class="mast">
  <img src="https://www.brasstally.com/app/icon-192.png" alt="" width="26" height="26"/>
  <span class="mark">Brass<span>tally</span></span>
</div>
<div class="wrap" id="wrap">
  <div class="card"><p class="none">Loading...</p></div>
</div>

<script type="module">
/* One door for everybody who invoices somebody using Brasstally.
 *
 * The per-business page at /c/<slug>/<token> already exists and works without
 * an account, which is deliberate: most suppliers will not sign up to read two
 * invoices.
 *
 * This is for the ones who work with several. Rather than keeping four
 * bookmarked addresses and guessing which is which, they sign in once with the
 * email the invitations went to and see every business in one place.
 *
 * The email is the credential and nothing else is: there is no password to
 * forget and no account to create. Signing in proves you can read the inbox
 * the invitation was sent to, which is the same thing the link itself proves.
 */
const BUILD = "2026-10-20 17:52Z";
const PROJECT = "https://xwoccmgppjmgficvmogr.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3b2NjbWdwcGptZ2ZpY3Ztb2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MDkwNjEsImV4cCI6MjEwMDI4NTA2MX0.B8rEqFhe53_URqHQHpWpW5JIIENsFqJ4o95o10gL6Hw";

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const sb = createClient(PROJECT, ANON);

const wrap = document.getElementById("wrap");
const esc = (v) => String(v ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const money = (n, ccy = "CAD") =>
  `${ccy === "CAD" ? "$" : ccy + " "}${(Math.abs(Number(n)) || 0)
    .toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

function signInScreen(note) {
  wrap.innerHTML = `
    <div class="card">
      <div class="eyebrow">For suppliers and contractors</div>
      <h1>Every business you invoice, in one place</h1>
      <p class="sub">
        Sign in with the address your invitations were sent to. No password, no account:
        we email you a link.
      </p>

      ${note ? `<p class="small" style="color:var(--debit)">${esc(note)}</p>` : ""}

      <input id="email" type="email" inputmode="email" autocomplete="email"
        placeholder="you@yourbusiness.com" aria-label="Your email address"/>
      <button class="go" id="send">Email me a link</button>

      <p class="small" style="margin-top:14px">
        Already have a link from one of them? It still works on its own. This page is for
        when you work with more than one.
      </p>
    </div>

    <div class="card">
      <div class="eyebrow">What you can do here</div>
      <div class="row"><span>See every invoice you have sent, and what each is waiting on</span></div>
      <div class="row"><span>Send a new one, to any of them</span></div>
      <div class="row"><span>Correct or withdraw one they have not accepted yet</span></div>
      <div class="row"><span>See what has been paid, and when the rest is expected</span></div>
    </div>

    <footer>
      Brasstally is the bookkeeping these businesses use. You are not signing up for it.<br/>
      <span style="opacity:.6">${BUILD}</span>
    </footer>`;

  const email = document.getElementById("email");
  const send = document.getElementById("send");

  send.onclick = async () => {
    const address = String(email.value || "").trim();
    if (!address || !address.includes("@")) {
      signInScreen("That does not look like an email address.");
      document.getElementById("email").value = address;
      return;
    }
    send.textContent = "Sending";
    send.disabled = true;
    const { error } = await sb.auth.signInWithOtp({
      email: address,
      options: { emailRedirectTo: `${location.origin}/suppliers` },
    });
    if (error) {
      signInScreen(error.message);
      document.getElementById("email").value = address;
      return;
    }
    wrap.innerHTML = `
      <div class="card">
        <h1>Check your email</h1>
        <p class="sub">
          A link is on its way to ${esc(address)}. Opening it brings you straight here.
        </p>
        <p class="small">
          Nothing arrived? It may be in spam, or the businesses you work with may have
          invited a different address. The invitation email they sent you will say which.
        </p>
      </div>`;
  };

  email.onkeydown = (e) => { if (e.key === "Enter") send.click(); };
}

async function dashboard(session) {
  wrap.innerHTML = `<div class="card"><p class="none">Finding your businesses...</p></div>`;

  const { data, error } = await sb.rpc("my_supplier_portals");
  if (error) {
    wrap.innerHTML = `<div class="card"><p class="none">${esc(error.message)}</p></div>`;
    return;
  }

  const portals = data || [];
  const who = session.user?.email || "";

  if (!portals.length) {
    wrap.innerHTML = `
      <div class="card">
        <h1>No businesses yet</h1>
        <p class="sub">
          Nobody has invited ${esc(who)} to a supplier page yet. When one of your customers
          does, it will appear here.
        </p>
        <p class="small">
          If you were expecting one, they may have invited a different address. Ask them which
          they used.
        </p>
        <button class="ghost" id="out">Sign out</button>
      </div>`;
    document.getElementById("out").onclick = signOut;
    return;
  }

  /* Each business, with what is outstanding between you. The figures come from
     the same function the single-business page uses, so the two can never
     disagree about what you are owed. */
  const cards = await Promise.all(portals.map(async (p) => {
    try {
      const r = await fetch(`${PROJECT}/rest/v1/rpc/contact_portal_view`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: ANON, Authorization: `Bearer ${ANON}` },
        body: JSON.stringify({ p_token: p.token }),
      });
      const d = await r.json();
      if (!d || d.ok === false) return { portal: p, broken: true };
      const live = (d.invoices || []).filter((i) => i.status !== "withdrawn" && !i.archived_at);
      const owed = live.reduce((n, i) => {
        if (i.status !== "accepted" && !i.payable_status) return n;
        if (i.payable_status && i.payable_status !== "open") return n;
        return n + ((Number(i.payable_amount ?? i.amount) || 0) - (Number(i.paid_amount) || 0));
      }, 0);
      const waiting = live.filter((i) => i.status === "pending").length;
      const needsYou = live.filter((i) => i.correction_at || i.status === "declined").length;
      return { portal: p, business: d.business, currency: d.currency || "CAD", owed, waiting, needsYou };
    } catch {
      return { portal: p, broken: true };
    }
  }));

  const totalOwed = cards.reduce((n, c) => n + (c.owed || 0), 0);
  const totalNeeds = cards.reduce((n, c) => n + (c.needsYou || 0), 0);

  wrap.innerHTML = `
    <div class="card">
      <div class="eyebrow">Signed in as ${esc(who)}</div>
      <h1>${cards.length} ${cards.length === 1 ? "business" : "businesses"}</h1>
      <div class="total"><span>Outstanding to you</span><span class="m">${money(totalOwed)}</span></div>
      ${totalNeeds
        ? `<p class="sub" style="margin:8px 0 0;color:var(--brass-text)">
             ${totalNeeds} ${totalNeeds === 1 ? "invoice needs" : "invoices need"} something from you.
           </p>`
        : ""}
    </div>

    ${cards.map((c) => c.broken
      ? `<div class="card"><div class="row"><span>
           <div>${esc(c.portal.business || "A business")}</div>
           <div class="small">That page is no longer active. Ask them for a new link.</div>
         </span></div></div>`
      : `<a class="card" href="/c/${esc(c.portal.slug || "x")}/${esc(c.portal.token)}"
            style="display:block;text-decoration:none;color:inherit">
           <div class="row" style="border:none;padding-top:0">
             <span>
               <div style="font-size:17px">${esc(c.business)}</div>
               <div class="small">
                 ${c.waiting ? `${c.waiting} with them for review` : "nothing waiting"}
                 ${c.needsYou ? ` · <span style="color:var(--brass-text)">${c.needsYou} needs you</span>` : ""}
               </div>
             </span>
             <span class="m" style="font-size:17px">${money(c.owed, c.currency)}</span>
           </div>
         </a>`).join("")}

    <div class="card">
      <button class="ghost" id="out">Sign out</button>
    </div>

    <footer>
      Each business keeps its own page, and the link they sent you still works on its own.<br/>
      <span style="opacity:.6">${BUILD}</span>
    </footer>`;

  document.getElementById("out").onclick = signOut;
}

async function signOut() {
  await sb.auth.signOut();
  signInScreen();
}

(async () => {
  const { data } = await sb.auth.getSession();
  if (data?.session) dashboard(data.session);
  else signInScreen();

  sb.auth.onAuthStateChange((_event, session) => {
    if (session) dashboard(session);
  });
})();
</script>
</body>
</html>
