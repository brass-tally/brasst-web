<!-- SVG animations for landing page product scenes -->
<!-- Drop these SVG blocks into the .win divs -->

<style>
  /* Animation timings - staggered so the flow tells a story */
  @keyframes slideUp { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { 0% { opacity: 0; transform: translateX(-8px); } 100% { opacity: 1; transform: translateX(0); } }
  @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes pulse { 0% { opacity: 0.9; } 8% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes highlight { 0% { background-color: rgba(201, 162, 75, 0.2); } 40% { background-color: rgba(201, 162, 75, 0.2); } 100% { background-color: transparent; } }

  /* Chat message animations */
  .chat-msg-user { animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both; }
  .chat-msg-ai { animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.8s both; }
  .confirm-card { animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 1.4s both; }

  /* Ledger row animation - lands as "fresh" highlight */
  .ledger-row-fresh { animation: highlight 8s cubic-bezier(0.2, 0.7, 0.2, 1) 2s infinite; }

  /* Save button pulse ring */
  .save-pulse { animation: pulse 8s ease-out 2.2s infinite; }

  /* SVG text rendering */
  .label-mono { font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; fill: #9c7a2a; }
  .text-muted { fill: #6c7166; font-size: 11px; font-family: ui-monospace, monospace; }
  .text-faint { fill: #9a9c8f; font-size: 11px; font-family: ui-monospace, monospace; }
  .text-main { fill: #20241f; font-size: 14px; }
  .text-number { fill: #20241f; font-family: ui-monospace, monospace; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .text-amount-out { fill: #20241f; font-family: ui-monospace, monospace; font-size: 13.5px; }
  .text-amount-in { fill: #237a50; font-family: ui-monospace, monospace; font-size: 13.5px; }
</style>

<!-- HERO: Receipt capture to ledger entry -->
<svg viewBox="0 0 600 320" class="hero-animation" style="width: 100%; display: block;">
  <!-- LEFT PANE: Ledger -->
  <g id="ledger-pane">
    <text x="20" y="24" class="label-mono">Ledger</text>
    <text x="280" y="24" class="label-mono" text-anchor="end">August</text>

    <!-- Balance -->
    <text x="20" y="52" style="font-family: ui-monospace; font-size: 26px; font-weight: bold; fill: #20241f;">$26,657.74</text>
    <text x="20" y="72" class="text-muted" style="font-size: 11px; fill: #237a50;">matches the bank</text>

    <!-- Fresh row (animates in) -->
    <g class="ledger-row-fresh">
      <rect x="0" y="88" width="300" height="28" rx="6" fill="transparent" />
      <text x="20" y="108" class="text-faint">Aug 21</text>
      <text x="70" y="108" class="text-main">Toner + paper</text>
      <text x="200" y="108" class="text-faint">Office</text>
      <text x="280" y="108" class="text-amount-out" text-anchor="end">−$118.43</text>
    </g>

    <!-- Static rows -->
    <line x1="10" y1="124" x2="290" y2="124" stroke="#e5e1d6" stroke-width="1" />
    <text x="20" y="144" class="text-faint">Aug 20</text>
    <text x="70" y="144" class="text-main">Client retainer</text>
    <text x="200" y="144" class="text-faint">Revenue</text>
    <text x="280" y="144" class="text-amount-in" text-anchor="end">+$4,500.00</text>

    <line x1="10" y1="160" x2="290" y2="160" stroke="#e5e1d6" stroke-width="1" />
    <text x="20" y="180" class="text-faint">Aug 18</text>
    <text x="70" y="180" class="text-main">Vercel Inc</text>
    <text x="200" y="180" class="text-faint">Software</text>
    <text x="280" y="180" class="text-amount-out" text-anchor="end">−$70.00</text>

    <!-- Footer note -->
    <text x="20" y="220" style="font-family: ui-monospace; font-size: 10.5px; fill: #9a9c8f;">Every entry keeps its receipt and the day you wrote it.</text>
  </g>

  <!-- DIVIDER -->
  <line x1="320" y1="0" x2="320" y2="320" stroke="#e5e1d6" stroke-width="1" />

  <!-- RIGHT PANE: Chat -->
  <g id="chat-pane">
    <text x="340" y="24" class="label-mono">Chat</text>
    <text x="580" y="24" class="label-mono" text-anchor="end">capture</text>

    <!-- User message -->
    <g class="chat-msg-user">
      <rect x="410" y="40" width="160" height="48" rx="10" fill="#fbfaf6" stroke="#e5e1d6" stroke-width="1" />
      <text x="425" y="58" style="font-size: 12px; fill: #6c7166; font-family: ui-monospace;">IMG_2481.jpeg</text>
      <text x="425" y="76" style="font-size: 13px; fill: #20241f;">staples run</text>
    </g>

    <!-- AI response -->
    <g class="chat-msg-ai">
      <text x="340" y="116" style="font-size: 12px; fill: #6c7166;">Here's what I read:</text>
    </g>

    <!-- Confirm card -->
    <g class="confirm-card">
      <rect x="340" y="134" width="230" height="156" rx="10" fill="#f6f4f0" stroke="#9c7a2a" stroke-width="1" stroke-opacity="0.42" />

      <!-- Header -->
      <text x="358" y="154" class="label-mono">✦ Log money out</text>

      <!-- Fields -->
      <text x="358" y="176" style="font-family: ui-monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; fill: #9a9c8f;">Amount</text>
      <rect x="358" y="182" width="98" height="20" rx="4" fill="#ffffff" stroke="#e5e1d6" stroke-width="1" />
      <text x="365" y="197" class="text-number">118.43</text>

      <!-- Date field -->
      <text x="468" y="176" style="font-family: ui-monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; fill: #9a9c8f;">Date</text>
      <rect x="468" y="182" width="90" height="20" rx="4" fill="#ffffff" stroke="#e5e1d6" stroke-width="1" />
      <text x="475" y="197" class="text-number">2026-08-21</text>

      <!-- Description -->
      <text x="358" y="222" style="font-family: ui-monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; fill: #9a9c8f;">Description</text>
      <rect x="358" y="228" width="200" height="20" rx="4" fill="#ffffff" stroke="#e5e1d6" stroke-width="1" />
      <text x="365" y="243" class="text-main">Toner + paper</text>

      <!-- Save button -->
      <rect x="358" y="256" width="98" height="24" rx="4" fill="#c9a24b" />
      <text x="407" y="273" style="font-family: ui-monospace; font-size: 12px; font-weight: bold; fill: #26200e; text-anchor: middle;">✓ Save entry</text>

      <!-- Pulse ring around button -->
      <circle cx="407" cy="268" r="24" fill="none" stroke="#c9a24b" stroke-width="1.5" opacity="0" class="save-pulse" />
    </g>

    <!-- Chat input -->
    <g style="opacity: 0.4;">
      <rect x="340" y="304" width="230" height="28" rx="8" fill="#fbfaf6" stroke="#e5e1d6" stroke-width="1" />
      <text x="350" y="324" style="font-size: 13px; fill: #9a9c8f;">e.g. paid Vercel $70…</text>
    </g>
  </g>
</svg>

<!-- TWO BOOKS: Transfer animation -->
<svg viewBox="0 0 600 200" class="transfer-animation" style="width: 100%; display: block;">

    <line x1="40" y1="84" x2="200" y2="84" stroke="#e5e1d6" stroke-width="1" />

    <!-- Salary out (animates) -->

      <text x="40" y="104" class="text-faint">Aug 15</text>
      <text x="90" y="104" class="text-main">Salary · to Maya</text>
      <text x="200" y="104" class="text-amount-out" text-anchor="end">−$1,250.00</text>
    </g>

    <text x="40" y="130" class="text-faint">Aug 20</text>
    <text x="90" y="130" class="text-main">Client retainer</text>
    <text x="200" y="130" class="text-amount-in" text-anchor="end">+$4,500.00</text>
  </g>

  <!-- Transfer line with dot animation -->

  <circle cx="300" cy="100" r="5" fill="#c9a24b" style="animation: lane 3.2s cubic-bezier(0.45, 0.05, 0.4, 0.95) infinite;" />
  <text x="300" y="130" style="font-family: ui-monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; fill: #9a9c8f; text-anchor: middle;">one motion</text>

  <!-- Right book: Personal -->
  <g id="book-right">
    <rect x="380" y="20" width="200" height="160" rx="8" fill="#ffffff" stroke="#e5e1d6" stroke-width="1" />

    <text x="400" y="68" style="font-family: ui-monospace; font-size: 20px; font-weight: bold; fill: #20241f;">$6,204.90</text>

    <line x1="400" y1="84" x2="560" y2="84" stroke="#e5e1d6" stroke-width="1" />

    <!-- Salary in (animates) -->
    <g style="animation: slideUp 0.6s ease 0.4s both;">
      <text x="400" y="104" class="text-faint">Aug 15</text>
      <text x="450" y="104" class="text-main">Salary · from Fernway</text>
      <text x="560" y="104" class="text-amount-in" text-anchor="end">+$1,250.00</text>
    </g>

    <!-- Groceries out -->
    <text x="400" y="130" class="text-faint">Aug 19</text>
    <text x="450" y="130" class="text-main">Groceries</text>
    <text x="560" y="130" class="text-amount-out" text-anchor="end">−$142.16</text>
  </g>

  <style>
    @keyframes lane {
      0% { transform: translateX(0); opacity: 0; }
      14% { opacity: 1; }
      86% { opacity: 1; }
      100% { transform: translateX(120px); opacity: 0; }
    }
  </style>
</svg>
